name: Verify PowerShell

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  parse-windows-powershell:
    env:
      PYTHONUTF8: 1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path tools -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host ("Line {0}, Col {1}: {2} | Text: {3}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text) }
            }
          }
          if ($failed) { exit 1 }

      - name: Run machine setup self-test
        shell: powershell
        run: .\tools\setup-ai-dev-machine.ps1 -SelfTest

      - name: Verify apply agent selection contract
        shell: powershell
        run: python .\tools\tests\verify-apply-agent-selection.py .

      - name: Verify updater contract
        shell: powershell
        run: python .\tools\tests\verify-updater.py .

      - name: Verify conflict-safe knowledge sync contract
        shell: powershell
        run: python .\tools\tests\verify-conflict-safe-knowledge.py .


      - name: Verify ordered docs layout compatibility
        shell: powershell
        run: python .\tools\tests\verify-docs-layout.py .

      - name: Run docs layout migration self-test
        shell: powershell
        run: .\tools\tests\test-migrate-docs-layout.ps1

      - name: Run docs layout migration safety tests
        shell: powershell
        run: .\tools\tests\test-migrate-docs-layout-safety.ps1

      - name: Verify security hardening contract
        shell: powershell
        run: python .\tools\tests\verify-security-hardening.py .

      - name: Verify active ordered references
        shell: powershell
        run: python .\tools\tests\verify-active-ordered-references.py .
