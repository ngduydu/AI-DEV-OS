name: Verify PowerShell

on:
  push:
    branches:
      - "**"
  pull_request:
    paths:
      - "tools/**/*.ps1"
      - ".github/workflows/verify-powershell.yml"

jobs:
  parse-windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path tools -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host ("Line {0}, Col {1}: {2} | Text: {3}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text) }
            }
          }
          if ($failed) { exit 1 }

      - name: Run machine setup self-test
        shell: powershell
        run: .\tools\setup-ai-dev-machine.ps1 -SelfTest

      - name: Verify apply agent selection contract
        shell: powershell
        run: python .\tools\tests\verify-apply-agent-selection.py .

      - name: Verify conflict-safe knowledge sync contract
        shell: powershell
        run: python .\tools\tests\verify-conflict-safe-knowledge.py .


      - name: Verify ordered docs layout compatibility
        shell: powershell
        run: python .\tools\tests\verify-docs-layout.py .

      - name: Run docs layout migration self-test
        shell: powershell
        run: .\tools\tests\test-migrate-docs-layout.ps1
